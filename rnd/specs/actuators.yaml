GIM6010-48:
  role: "inline upper-arm yaw candidate (inline-arm study I1, 2026-11-28; rnd/inline_study.py)"
  maker: SteadyWin
  gear_ratio: 48
  stages: 2                  # two-stage planetary, steel gears (rcdrone listing)
  voltage_nominal_v: 24      # 12–56 V range (rcdrone / Robotics Center listings)
  rated_torque_nm: 30        # "nominal 30 N·m" (aifitlab, Robotics Center). = the GIM6010-8's 5 N·m / 8 × 48 at 100 % gearbox efficiency;
                             # at a two-stage η ≈ 0.86 (ESTIMATE) ≈ 26 N·m. The yaw needs ≤ 4 N·m p95, so the conflict does not decide anything.
  peak_torque_nm: 66         # stall 66 N·m (Robotics Center: = 11 / 8 × 48). CONFLICT: openelab titles it "88 N·m" (likely another driver / 48 V).
                             # Design to 66 until the seller's datasheet.
  rated_speed_rpm: 20        # nominal 20 rpm, max 70 rpm after reduction (GDS68 driver, 24 V listing): 3× slower than today's yaw (60 rpm)
  max_speed_rpm: 70
  mass_g: 777                # 776.9 g with driver, 758.9 g without (Robotics Center); one listing gives 1 kg net
  outer_diameter_mm: 80
  length_mm: 67.5            # 56.5 without the driver (Robotics Center)
  backlash_arcmin: 15        # rcdrone listing ("15 arcmin")
  encoder: "single, motor side (14-bit; one variant column lists 16-bit); no output encoder listed"
  rotor_inertia_kgm2: 2.4e-5 # ESTIMATE: as the GIM6010-8 (same motor)
  price_usd: [135, 156]      # aifitlab $135 (backordered), $156 regular (sold out) (2026-11-28 search snippets; pages not reachable from this session)
  notes: "Reseller data only; driver pairing (SDC104 / SDC215 / GDS68) and speed conflict between listings. Mounting pattern not found."
  sources:
    - https://www.roboticscenter.ai/store/product/steadywin-gim6010-48-planetary-reducer-servo-motor/
    - https://rcdrone.top/products/steadywin-gim6010-48-planetary-reducer-servo-motor
    - https://aifitlab.com/products/steadywin-gim6010-48-planetary-reducer-servo-motor
    - https://openelab.io/products/steadywin-gim6010-48-robot-joint-motor-88nm-planetary-gear-servo

