# Pip v4 actuator specs (T01). Every value has a source; ESTIMATE = unverified.
# Prices are retailer snapshots (2026-11), shipping/tax extra.
GIM6010-8:
  role: cartridge M (shoulders, elbows, base wheels)
  maker: SteadyWin
  gear_ratio: 8
  voltage_nominal_v: 24
  voltage_range_v: "12-28 per manual; some retailers list 12-56 (driver variant). DESIGN TO <=28 V"
  rated_torque_nm: 5
  peak_torque_nm: 11
  rated_speed_rpm: 120     # after reduction, ±10 %
  max_speed_rpm: 420       # after reduction, ±10 %
  mass_g: 388              # with SDC104 driver (370 g without)
  outer_diameter_mm: 80    # retailer description; confirm with installation drawing (ESTIMATE until drawing checked)
  interface: "CAN + USB-C (SDC104 driver), integrated driver + encoder"
  continuous_current_a: 10.5
  price_usd: [90, 94]      # loop 14 verified with driver: aifitlab $90 (GDS68), SteadyWin store $93.88; bare motor $70.35
  notes: >
    Some Amazon variants differ (48 V/4.6 N·m/17.9 N·m locking). Buy the 24 V SDC104 version and verify on arrival.
  sources:
    - https://sdalal1.github.io/assets/pdf/SteadyWin_GIM6010-8_Manual_rev1.pdf
    - https://actuatorlist.com/actuators/steadywin-gim6010-8
    - https://www.roboticscenter.ai/store/product/steadywin-gim6010-8-planetary-reducer-servo-motor/
    - https://openelab.io/products/steadywin-gim6010-8-robot-motor
    - https://www.amazon.com/Planetary-Robotic-Exoskeleton-Control-GIM6010-8/dp/B0DKF9P4TC

GIM8108-8:
  role: "candidate for shoulder pitch + elbow under the owner's 20 lb two-handed requirement (R2c, 2026-11-27)"
  maker: SteadyWin
  gear_ratio: 8
  voltage_nominal_v: 48      # most listings 48 V (12–56 V or 24–56 V range): CONFIRM 24 V operation and speed with the seller
  rated_torque_nm: 7.5
  peak_torque_nm: 22         # listed as stall torque
  rated_speed_rpm: 60        # ESTIMATE at 24 V (listings give ~120 rpm class at 48 V)
  mass_g: 396                # with driver (GDZ468); 375 g motor only
  outer_diameter_mm: 96      # ESTIMATE (8108 stator class); confirm with the drawing
  price_usd: [85, 110]       # $85 without driver (backordered at one seller); driver version ESTIMATE
  notes: "Reseller data only, no official datasheet found (2026-11-27). Voltage ranges conflict between listings."
  sources:
    - https://openelab.com/products/steadywin-gim8108-8-gearmotor-robotics
    - https://aifitlab.com/products/steadywin-gim8108-8-planetary-reducer-servo-motor
    - https://www.roboticscenter.ai/store/product/steadywin-gim8108-8-planetary-reducer-servo-motor/
    - https://rcdrone.top/products/steadywin-gim8108-8-planetary-reducer-servo-motor

GIM8108-36:
  role: "slim-arm study (2026-11-27): inline shoulder pitch / roll, no belt"
  maker: SteadyWin
  gear_ratio: 36
  voltage_nominal_v: 24      # SDC303 driver version (24 V); SDC103 is 48 V
  rated_torque_nm: 35.1      # SDC303 (24 V) per listing; 32.76 with SDC103
  peak_torque_nm: 102.9      # stall, SDC303
  rated_speed_rpm: 48        # nominal after reduction (48–51)
  mass_g: 1000               # one seller's net weight
  outer_diameter_mm: 100     # ESTIMATE (8108 frame); not published
  price_usd: [152, 190]
  sources:
    - https://aifitlab.com/products/steadywin-gim8108-36-planetary-reducer-servo-motor
    - https://openelab.com/products/steadywin-gim8108-36-robot-actuator
    - https://www.roboticscenter.ai/store/product/steadywin-gim8108-36-planetary-reducer-servo-motor/

