[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robodog"
version = "0.1.0"
description = "Pip: a small 3D-printed robot dog for the Raspberry Pi 5"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
  "numpy>=1.26",
  "pillow>=10",
  "anthropic>=2.12",
]

[project.optional-dependencies]
# Everything that only makes sense on the robot itself.
pi = [
  "adafruit-circuitpython-servokit",
  "adafruit-circuitpython-vl53l1x",
  "adafruit-circuitpython-mpu6050",
  "ultralytics",
  "ncnn",
  "vosk",
  "sounddevice",
  "piper-tts",
]
dev = ["pytest"]

[tool.setuptools]
packages = ["robodog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
